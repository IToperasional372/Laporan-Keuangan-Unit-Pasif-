<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Keuangan Unit biMBA</title>
  <base target="_top"> 
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Library html2pdf.js untuk Ekspor PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    .loader {
      border: 4px solid #f3f3f3;
      border-radius: 50%;
      border-top: 4px solid #4f46e5;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loading-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85); z-index: 9999;
      justify-content: center; align-items: center; flex-direction: column;
    }
    
    .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
    .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb:hover { background: #a0a0a5; }
    
    [x-cloak] { display: none !important; }

    /* Mencegah pemotongan baris tabel saat cetak PDF */
    .pdf-no-break tr, .pdf-no-break td, .pdf-no-break th {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    #sidebar { transition: width 0.3s ease-in-out; }
    .sidebar-collapsed { width: 5.5rem !important; }
    .sidebar-collapsed .sidebar-text { display: none !important; opacity: 0; }
    .sidebar-collapsed .sidebar-logo-img { width: 3rem !important; height: 3rem !important; }
    .sidebar-collapsed #sidebar-header { padding: 1.5rem 0.5rem !important; padding-top: 4.5rem !important; }
    .sidebar-collapsed #sidebar-toggle-btn { right: 50% !important; transform: translateX(50%) !important; }
    .sidebar-collapsed #sidebar-nav { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .sidebar-collapsed #sidebar-footer { padding: 1rem 0.75rem !important; }
    .sidebar-collapsed .nav-btn, .sidebar-collapsed .logout-btn { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
    .sidebar-collapsed .nav-btn i, .sidebar-collapsed .logout-btn i { font-size: 1.75rem !important; margin: 0 !important; }
    .sidebar-collapsed .laporan-utama-title { display: none !important; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- OVERLAY LOADING -->
  <div id="loading-overlay">
    <div class="loader mb-4"></div>
    <p class="text-indigo-600 font-bold" id="loading-text">Memuat data...</p>
    <p class="text-gray-500 text-sm mt-2 font-medium" id="loading-subtext">Mohon tunggu...</p>
  </div>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
      <div class="text-center mb-8">
        <img src="https://lh3.googleusercontent.com/d/1E9HTjJw0PVEORIqBLof8ifE1RLDk-2mF" 
             onerror="this.src='https://placehold.co/400x400/png?text=Logo+biMBA'"
             class="w-40 h-40 object-cover mx-auto rounded-full shadow-sm mb-4" 
             alt="Logo biMBA">
        
        <h1 class="text-2xl font-bold text-gray-800">Sistem Keuangan</h1>
        <p class="text-gray-500 text-sm mt-1">Rekap Laporan Pusat</p>
      </div>
      <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
          <input type="text" id="username-input" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition" placeholder="Masukkan username Anda" required>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password Akses</label>
          <input type="password" id="password-input" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200">
          Masuk Sistem
        </button>
        <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- MAIN APP VIEW -->
  <div id="app-view" class="hidden flex h-screen overflow-hidden">
    <aside class="w-64 bg-indigo-900 text-white flex flex-col hidden md:flex transition-all z-30 shadow-xl relative" id="sidebar">
      <button id="sidebar-toggle-btn" onclick="toggleSidebar()" class="absolute right-4 top-4 w-10 h-10 bg-[#1e1b4b] hover:bg-[#2c2882] text-white rounded-[10px] shadow-sm z-50 transition-all flex items-center justify-center border border-white/10" title="Perkecil/Perbesar Sidebar">
        <i class="ph-bold ph-list text-xl"></i>
      </button>

      <div class="p-6 pt-20 text-center border-b border-indigo-800 transition-all duration-300 flex flex-col items-center" id="sidebar-header">
        <div class="inline-block mb-3 transition-transform hover:scale-105 sidebar-logo-container">
          <img src="https://lh3.googleusercontent.com/d/1E9HTjJw0PVEORIqBLof8ifE1RLDk-2mF" 
               onerror="this.src='https://placehold.co/200x200/png?text=Logo'"
               class="w-24 h-24 object-cover mx-auto rounded-full shadow-md transition-all duration-300 sidebar-logo-img" 
               alt="Logo">
        </div>
        <h2 class="text-xl font-extrabold text-white tracking-wide sidebar-text transition-opacity duration-200">Unit Pasif</h2>
        <div class="inline-flex items-center gap-1.5 bg-indigo-800 text-indigo-100 px-3 py-1 rounded-full mt-2 border border-indigo-700 shadow-inner sidebar-text transition-opacity duration-200">
           <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
           <p class="text-xs font-semibold" id="sidebar-username">Welcome, Admin</p>
        </div>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto transition-all duration-300" id="sidebar-nav">
        <button onclick="navigate('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-indigo-800 text-white transition border border-transparent" title="Dashboard Analitik">
          <i class="ph ph-squares-four text-xl"></i> <span class="sidebar-text whitespace-nowrap">Dashboard Analitik</span>
        </button>
        <div class="px-4 mt-6 mb-2 text-xs font-semibold text-indigo-300 uppercase tracking-wider laporan-utama-title">Laporan Utama</div>
        <button onclick="navigate('rekap_master')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-indigo-800 text-indigo-100 transition border border-transparent" title="Rekap Master">
          <i class="ph ph-table text-xl text-emerald-400"></i> <span class="sidebar-text whitespace-nowrap">Rekap Master</span>
        </button>
      </nav>
      <div class="p-4 border-t border-indigo-800 transition-all duration-300" id="sidebar-footer">
        <button onclick="logout()" class="logout-btn w-full flex items-center justify-center gap-2 px-4 py-2 rounded text-indigo-200 hover:text-white hover:bg-red-500 transition" title="Keluar Sistem">
          <i class="ph ph-sign-out text-xl"></i> <span class="sidebar-text whitespace-nowrap">Keluar Sistem</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-100 relative z-10">
      <header class="md:hidden bg-indigo-900 text-white border-b border-indigo-800 p-4 flex justify-between items-center sticky top-0 z-10 shadow-md">
        <div class="flex items-center gap-3">
          <img src="https://lh3.googleusercontent.com/d/1E9HTjJw0PVEORIqBLof8ifE1RLDk-2mF" onerror="this.src='https://placehold.co/100x100/png'" class="w-9 h-9 object-cover rounded-full shadow-sm">
          <h1 class="font-extrabold text-lg">Unit Pasif</h1>
        </div>
        <button onclick="document.getElementById('sidebar').classList.toggle('sidebar-collapsed')" class="w-10 h-10 bg-[#1e1b4b] hover:bg-[#2c2882] text-white rounded-[10px] shadow-sm flex items-center justify-center border border-white/10 transition-colors">
          <i class="ph-bold ph-list text-xl"></i>
        </button>
      </header>
      <div class="p-4 md:p-6 lg:p-8 w-full h-full overflow-y-auto" id="content-area"></div>
    </main>
  </div>

  <script>
    if (typeof google === 'undefined') {
      window.google = {
        script: {
          run: {
            withSuccessHandler: function(callback) { this._successHandler = callback; return this; },
            withFailureHandler: function(callback) { this._failureHandler = callback; return this; },
            checkLogin: function(user, pwd) {
              setTimeout(() => {
                if (user === 'Arifjuna' && pwd === 'adminpusat') this._successHandler({ success: true });
                else this._successHandler({ success: false, message: "Username/Password salah!" });
              }, 200);
            },
            getDashboardStats: function(force) {
              setTimeout(() => this._successHandler({ penerimaan: 50978946310, pengeluaran: 20406086934, saldo: 30572859376, cabang: 110, branchList: ["Agus Salim", "Jatiraya"] }), 300);
            },
            getRekapMasterData: function(unit, force) {
              setTimeout(() => this._successHandler({
                success: true, cabang: 110, months: ['Jul 25', 'Aug 25', 'Sep 25', 'Oct 25', 'Nov 25', 'Dec 25', 'Jan 26', 'Feb 26', 'Mar 26', 'Apr 26', 'May 26', 'Jun 26', 'Grand Total'],
                branchList: ["Agus Salim", "Jatiraya"],
                sections: [{ title: 'PENERIMAAN', type: 'currency', hasTotal: true, rows: [{name: 'SPP', values: [5000000, 6000000, 7000000, 8000000, 9000000, 10000000, 11000000, 12000000, 13000000, 14000000, 15000000, 16000000, 120000000]}], totals: [5000000, 6000000, 7000000, 8000000, 9000000, 10000000, 11000000, 12000000, 13000000, 14000000, 15000000, 16000000, 120000000] }]
              }), 500);
            }
          }
        }
      };
    }

    let BRANCH_LIST = [];
    let currentFilterUnit = 'Semua Unit';
    let sessionUsername = 'Admin';
    let cachedDashboardStats = null;
    let cachedRekapData = {};
    let myPieChart = null;
    let isSidebarCollapsed = false;

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0 }).format(angka || 0);
    
    let loadTimer;
    const showLoading = (msg = "Memuat data...", isHeavy = false) => { 
      let sec = 0;
      document.getElementById('loading-text').innerText = msg;
      
      if(isHeavy) {
         document.getElementById('loading-subtext').innerText = `Tunggu sebentar... (Menghitung: 0s)`;
         document.getElementById('loading-subtext').style.display = 'block';
         loadTimer = setInterval(() => {
            sec++;
            document.getElementById('loading-subtext').innerText = `Tunggu sebentar... (Menghitung: ${sec}s)`;
         }, 1000);
      } else {
         document.getElementById('loading-subtext').style.display = 'none';
      }
      document.getElementById('loading-overlay').style.display = 'flex'; 
    };
    
    const hideLoading = () => { 
      document.getElementById('loading-overlay').style.display = 'none'; 
      if(loadTimer) clearInterval(loadTimer);
    };

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      isSidebarCollapsed = !isSidebarCollapsed;
      if (isSidebarCollapsed) sidebar.classList.add('sidebar-collapsed');
      else sidebar.classList.remove('sidebar-collapsed');
    }

    function checkSession() {
      const savedUser = localStorage.getItem('pasif_session_user');
      const savedTime = localStorage.getItem('pasif_session_time');
      
      if (savedUser && savedTime) {
        const now = Date.now();
        const timePassed = now - parseInt(savedTime);
        const oneHour = 60 * 60 * 1000;
        
        if (timePassed < oneHour) {
          sessionUsername = savedUser;
          document.getElementById('sidebar-username').innerText = `Welcome, ${savedUser}`;
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('app-view').classList.remove('hidden');
          navigate('dashboard');
        } else {
          logout();
        }
      }
    }

    function getGreetingTime() {
       const hour = new Date().getHours();
       if (hour >= 4 && hour < 11) return "Selamat pagi";
       if (hour >= 11 && hour < 15) return "Selamat siang";
       if (hour >= 15 && hour < 18) return "Selamat sore";
       return "Selamat malam";
    }

    function playWelcomeVoice(name) {
       if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const greeting = getGreetingTime();
          const ucapan = new SpeechSynthesisUtterance(`${greeting}, ${name}. Selamat datang di sistem rekap laporan pusat unit pasif.`);
          ucapan.lang = 'id-ID'; 
          ucapan.rate = 0.95; 
          
          const voices = window.speechSynthesis.getVoices();
          const idVoice = voices.find(voice => 
             voice.lang.replace('_', '-').toLowerCase() === 'id-id' || 
             voice.name.toLowerCase().includes('indonesia')
          );
          
          if (idVoice) {
             ucapan.voice = idVoice;
          }
          
          window.speechSynthesis.speak(ucapan);
       }
    }

    if ('speechSynthesis' in window) {
       window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }

    function handleLogin() {
      const user = document.getElementById('username-input').value;
      const pwd = document.getElementById('password-input').value;
      showLoading("Otentikasi Akun...");
      google.script.run.withSuccessHandler(function(res) {
        hideLoading();
        if (res.success) {
          sessionUsername = user;
          localStorage.setItem('pasif_session_user', user);
          localStorage.setItem('pasif_session_time', Date.now());
          document.getElementById('sidebar-username').innerText = `Welcome, ${user}`;
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('app-view').classList.remove('hidden');
          playWelcomeVoice(user);
          navigate('dashboard');
        } else {
          const err = document.getElementById('login-error');
          err.innerText = res.message; err.classList.remove('hidden');
        }
      }).checkLogin(user, pwd);
    }

    function logout() { 
      document.getElementById('password-input').value = '';
      cachedDashboardStats = null;
      cachedRekapData = {};
      localStorage.removeItem('pasif_session_user');
      localStorage.removeItem('pasif_session_time');
      document.getElementById('app-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    function navigate(view) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-800', 'text-white');
        btn.classList.add('hover:bg-indigo-800', 'text-indigo-100');
      });
      const activeBtn = document.querySelector(`.nav-btn[onclick="navigate('${view}')"]`);
      if(activeBtn) { activeBtn.classList.add('bg-indigo-800', 'text-white'); activeBtn.classList.remove('hover:bg-indigo-800', 'text-indigo-100'); }
      const content = document.getElementById('content-area');
      content.innerHTML = '';
      if (view === 'dashboard') renderDashboard(content);
      else if (view === 'rekap_master') renderRekapMasterHeader(content);
    }

    function renderDashboard(container) {
      if (cachedDashboardStats) { 
        BRANCH_LIST = cachedDashboardStats.branchList || [];
        buildDashboardUI(container, cachedDashboardStats); 
        return; 
      }
      showLoading("Mensinkronisasi Unit Cabang...", true);
      google.script.run.withSuccessHandler(function(stats) { 
        hideLoading(); 
        cachedDashboardStats = stats; 
        BRANCH_LIST = stats.branchList || []; 
        buildDashboardUI(container, stats); 
      }).getDashboardStats(false);
    }

    function buildDashboardUI(container, stats) {
        let marginPengeluaran = 0;
        if (stats.penerimaan > 0) {
            marginPengeluaran = ((stats.pengeluaran / stats.penerimaan) * 100).toFixed(1);
        }

        let rataPenerimaan = 0;
        if (stats.cabang > 0) {
            rataPenerimaan = Math.round(stats.penerimaan / stats.cabang);
        }

        let statusKas = stats.saldo > 0 ? 
            '<span class="text-emerald-600 font-bold flex items-center gap-1"><i class="ph-bold ph-trend-up"></i> Positif (Surplus)</span>' : 
            '<span class="text-rose-600 font-bold flex items-center gap-1"><i class="ph-bold ph-trend-down"></i> Negatif (Defisit)</span>';

        container.innerHTML = `
          <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6">Dashboard Analitik</h2>
          <div class="text-gray-500 mb-6">Selamat datang, <span class="font-bold text-indigo-700">${sessionUsername}</span>!</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-red-600 rounded-xl shadow p-5 text-white relative overflow-hidden"><p class="text-sm opacity-80 font-semibold">Total Unit</p><h3 class="text-3xl font-bold">${stats.cabang}</h3><i class="ph-fill ph-buildings text-7xl absolute -bottom-4 -right-2 opacity-20"></i></div>
            <div class="bg-emerald-500 rounded-xl shadow p-5 text-white relative overflow-hidden"><p class="text-sm opacity-80 font-semibold">Pemasukan</p><h3 class="text-xl font-bold">Rp ${formatRp(stats.penerimaan)}</h3><i class="ph-fill ph-trend-up text-7xl absolute -bottom-4 -right-2 opacity-20"></i></div>
            <div class="bg-amber-500 rounded-xl shadow p-5 text-white relative overflow-hidden"><p class="text-sm opacity-80 font-semibold">Pengeluaran</p><h3 class="text-xl font-bold">Rp ${formatRp(stats.pengeluaran)}</h3><i class="ph-fill ph-trend-down text-7xl absolute -bottom-4 -right-2 opacity-20"></i></div>
            <div class="bg-rose-500 rounded-xl shadow p-5 text-white relative overflow-hidden"><p class="text-sm opacity-80 font-semibold">Saldo Kas</p><h3 class="text-xl font-bold">Rp ${formatRp(stats.saldo)}</h3><i class="ph-fill ph-wallet text-7xl absolute -bottom-4 -right-2 opacity-20"></i></div>
          </div>
          
          <div class="flex justify-center w-full">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-5xl items-stretch">
              <!-- Proporsi Keuangan (Pie Chart) -->
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between h-[340px] relative overflow-hidden">
                <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center gap-2 border-b border-gray-100 pb-3 z-10">
                  <i class="ph-bold ph-chart-pie text-indigo-600 text-lg"></i> Proporsi Keuangan
                </h3>
                <div class="relative w-full flex-1 flex items-center justify-center pt-2 pb-1 min-h-0">
                  <canvas id="pieChart"></canvas>
                </div>
              </div>

              <!-- Executive Summary -->
              <div class="bg-white rounded-xl shadow-sm border-l-4 border-l-indigo-600 border-y border-r border-gray-200 p-6 flex flex-col justify-between h-[340px] relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-indigo-50 opacity-40 pointer-events-none">
                   <i class="ph-fill ph-chart-line-up" style="font-size: 140px;"></i>
                </div>
                <div>
                  <h3 class="text-sm font-bold text-indigo-900 uppercase tracking-wider flex items-center gap-2 border-b border-gray-100 pb-3 z-10">
                    <i class="ph-bold ph-lightbulb text-indigo-600 text-lg"></i> Executive Summary
                  </h3>
                  <p class="text-gray-600 text-[13.5px] leading-relaxed z-10 mt-3">
                     Sistem mengakumulasi data dari <strong class="text-gray-800">${stats.cabang} unit</strong>. 
                     Tingkat serapan dana operasional saat ini mencapai <strong class="text-amber-600 font-bold">${marginPengeluaran}%</strong> dari total pemasukan.
                  </p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 z-10 flex flex-col gap-3">
                   <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-gray-500 uppercase tracking-wide">Rata-rata Pemasukan / Unit</span>
                      <span class="text-sm font-extrabold text-gray-800">Rp ${formatRp(rataPenerimaan)}</span>
                   </div>
                   <div class="flex justify-between items-center pt-2.5 border-t border-gray-200/80">
                      <span class="text-xs font-bold text-gray-500 uppercase tracking-wide">Status Arus Kas Global</span>
                      <span class="text-xs sm:text-sm font-bold">${statusKas}</span>
                   </div>
                </div>
              </div>
            </div>
          </div>
        `;
        initCharts(stats.penerimaan, stats.pengeluaran, stats.saldo);
    }

    function initCharts(inV, outV, balance) {
       setTimeout(() => {
          const ctxP = document.getElementById('pieChart');
          if(!ctxP) return;
          if(myPieChart) myPieChart.destroy(); 
          
          myPieChart = new Chart(ctxP, { 
            type: 'doughnut', 
            data: { 
              labels: ['Masuk', 'Keluar', 'Saldo'], 
              datasets: [{ 
                data: [inV, outV, balance], 
                backgroundColor: ['#10b981', '#f59e0b', '#f43f5e'],
                borderWidth: 0
              }] 
            },
            options: {
              maintainAspectRatio: false,
              cutout: '65%',
              plugins: { 
                legend: { 
                  position: 'bottom', 
                  labels: { boxWidth: 12, padding: 15, font: { size: 11, weight: '600' } } 
                } 
              }
            }
          });
       }, 200);
    }

    function renderRekapMasterHeader(container) {
      let opts = `<option value="Semua Unit">Semua Unit (Gabungan)</option>`;
      BRANCH_LIST.forEach(b => opts += `<option value="${b}">${b}</option>`);
      
      let titleText = currentFilterUnit === 'Semua Unit' ? "Rekap Master Keseluruhan" : `Laporan Keuangan Unit: ${currentFilterUnit}`;
      let subtitleText = currentFilterUnit === 'Semua Unit' ? `Akumulasi total nilai gabungan dari ${BRANCH_LIST.length} Unit.` : `Menampilkan data khusus untuk unit ${currentFilterUnit}.`;

      container.innerHTML = `
        <div class="flex flex-col lg:flex-row justify-between lg:items-center mb-6 gap-4">
          <div>
            <h2 class="text-2xl font-bold text-gray-800" id="rekap-title">${titleText}</h2>
            <p class="text-gray-500 text-sm mt-1" id="rekap-subtitle">${subtitleText}</p>
          </div>
          <div class="flex flex-wrap lg:flex-nowrap items-center gap-2.5 w-full lg:w-auto">
            
            <div class="relative group w-full sm:w-auto flex-1 sm:flex-initial">
               <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
                  <i class="ph-bold ph-funnel text-indigo-500 group-hover:text-indigo-600 transition-colors"></i>
               </div>
               <select id="unit-filter" onchange="triggerFilter()" class="bg-white border border-gray-300 text-gray-800 font-semibold text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 pr-10 py-2.5 shadow-sm appearance-none cursor-pointer hover:border-indigo-400 transition-all sm:w-64">
                 ${opts}
               </select>
               <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none">
                  <i class="ph-bold ph-caret-down text-gray-500"></i>
               </div>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end shrink-0">
               <button onclick="forceRefreshData()" title="Sinkronisasi Data Terbaru" class="bg-white p-2.5 rounded-lg border border-gray-300 shadow-sm transition hover:bg-gray-100 text-gray-700 shrink-0"><i class="ph-bold ph-arrows-clockwise text-lg"></i></button>
               <button onclick="exportTableToExcel('Rekap.csv')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-md transition-all font-medium text-sm shrink-0"><i class="ph-bold ph-file-xls text-lg"></i> Ekspor Excel</button>
               <button onclick="exportTableToPDF()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-md transition-all font-medium text-sm shrink-0"><i class="ph-bold ph-file-pdf text-lg"></i> Ekspor PDF</button>
            </div>
          </div>
        </div>
        <div id="rekap-table-container"></div>
      `;
      document.getElementById('unit-filter').value = currentFilterUnit;
      loadRekapTableData();
    }

    function triggerFilter() { 
      currentFilterUnit = document.getElementById('unit-filter').value; 
      
      if (currentFilterUnit === 'Semua Unit') {
        document.getElementById('rekap-title').innerText = "Rekap Master Keseluruhan";
        document.getElementById('rekap-subtitle').innerText = `Akumulasi total nilai gabungan dari ${BRANCH_LIST.length} Unit.`;
      } else {
        document.getElementById('rekap-title').innerText = `Laporan Keuangan Unit: ${currentFilterUnit}`;
        document.getElementById('rekap-subtitle').innerText = `Menampilkan data khusus untuk unit ${currentFilterUnit}.`;
      }
      
      loadRekapTableData(); 
    }

    function updateDropdownOptions() {
      const select = document.getElementById('unit-filter');
      if (!select) return;
      let opts = `<option value="Semua Unit">Semua Unit (Gabungan)</option>`;
      BRANCH_LIST.forEach(b => opts += `<option value="${b}">${b}</option>`);
      select.innerHTML = opts;
      select.value = currentFilterUnit;
    }

    function forceRefreshData() {
      cachedDashboardStats = null; cachedRekapData = {};
      let isHeavy = currentFilterUnit === 'Semua Unit';
      showLoading(`Mensinkronisasi Ulang Data...`, isHeavy);
      google.script.run.withSuccessHandler(function(data) { 
        hideLoading(); 
        if(data.success) {
           cachedRekapData[currentFilterUnit] = data; 
           BRANCH_LIST = data.branchList || BRANCH_LIST;
           updateDropdownOptions();
        }
        renderTableMarkup(data); 
      }).getRekapMasterData(currentFilterUnit, true);
    }

    function loadRekapTableData() {
      if (cachedRekapData[currentFilterUnit]) { 
        if (cachedRekapData[currentFilterUnit].branchList) {
           BRANCH_LIST = cachedRekapData[currentFilterUnit].branchList;
           updateDropdownOptions();
        }
        renderTableMarkup(cachedRekapData[currentFilterUnit]); 
        return; 
      }
      
      let isHeavy = currentFilterUnit === 'Semua Unit';
      showLoading(`Memproses data ${currentFilterUnit}...`, isHeavy);
      
      google.script.run.withSuccessHandler(function(data) { 
        hideLoading(); 
        if(data.success) {
           cachedRekapData[currentFilterUnit] = data; 
           
           if (data.branchList && data.branchList.length > 0) {
              BRANCH_LIST = data.branchList;
              updateDropdownOptions();
           }
        }
        renderTableMarkup(data); 
      }).getRekapMasterData(currentFilterUnit, false);
    }

    function renderTableMarkup(data) {
        const tContainer = document.getElementById('rekap-table-container');
        if (!data || !data.success) { tContainer.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg shadow-sm border border-red-200"><i class="ph-bold ph-warning-circle mr-2"></i> Gagal: ${data ? data.error : 'Error Tersembunyi'}</div>`; return; }
        const months = data.months || [];
        let html = `<div class="bg-white rounded-xl shadow-md border border-gray-300 overflow-hidden"><div class="table-container overflow-x-auto"><table class="min-w-full border-collapse border border-gray-300">
          <thead class="bg-indigo-700 text-white sticky top-0 z-30 shadow-md"><tr><th class="px-4 py-3 text-left text-xs font-bold uppercase border border-indigo-600 bg-indigo-700 sticky left-0 z-40 min-w-[200px]">Kategori Laporan</th>
          ${months.map(m => `<th class="px-4 py-3 text-right text-xs font-bold border border-indigo-600 whitespace-nowrap">${m}</th>`).join('')}</tr></thead><tbody>`;
        
        data.sections.forEach(sec => {
          html += `<tr class="bg-indigo-50 border-b border-gray-300"><td colspan="${months.length + 1}" class="px-4 py-2 font-bold text-sm text-indigo-800 italic sticky left-0 bg-indigo-50 z-20 underline">${sec.title}</td></tr>`;
          sec.rows.forEach((row, idx) => {
            const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-gray-50';
            html += `<tr class="${rowBg} hover:bg-yellow-50 transition-colors"><td class="px-4 py-2 text-sm border border-gray-300 sticky left-0 ${rowBg} z-20 font-medium">${row.name}</td>`;
            row.values.forEach(v => {
              let dv = v;
              if (sec.type === 'currency' && v !== 0) dv = formatRp(v);
              else if (sec.type === 'percentage') { 
                let pct = v * 100; 
                if(currentFilterUnit === 'Semua Unit' && data.cabang > 0) pct /= data.cabang; 
                dv = v !== 0 ? pct.toFixed(2) + '%' : '0%'; 
              }
              html += `<td class="px-4 py-2 text-sm ${v === 0 ? 'text-gray-400' : 'text-gray-700'} text-right border border-gray-300">${dv}</td>`;
            });
            html += `</tr>`;
          });
          if (sec.hasTotal && sec.totals) {
            html += `<tr class="bg-indigo-100 font-bold border-b border-gray-300"><td class="px-4 py-2 text-sm border border-gray-300 sticky left-0 bg-indigo-100 z-20">Total ${sec.title.split(' ')[0]}</td>
            ${sec.totals.map(t => `<td class="px-4 py-2 text-sm text-right border border-gray-300">${sec.type === 'currency' ? formatRp(t) : t}</td>`).join('')}</tr>`;
          }
        });
        html += `</tbody></table></div></div>`;
        tContainer.innerHTML = html;
    }

    function exportTableToExcel(f) {
      const t = document.querySelector("table"); if (!t) return;
      let c = []; const r = t.querySelectorAll("tr");
      r.forEach(row => { 
        let cols = row.querySelectorAll("td, th"), data = []; 
        cols.forEach(col => data.push('"' + col.innerText.replace(/"/g, '""') + '"')); 
        c.push(data.join(";")); 
      });
      const b = new Blob([c.join("\n")], {type: "text/csv;charset=utf-8;"}), a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = f; a.click();
    }

    function exportTableToPDF() {
      const container = document.getElementById('rekap-table-container');
      if (!container || !container.querySelector('table')) return;
      
      showLoading('Membuat dokumen PDF...');
      
      setTimeout(() => {
        try {
          const titleText = document.getElementById('rekap-title')?.innerText || 'Rekap Keuangan';
          const originalTable = container.querySelector('table');
          
          // Simpan scroll position
          const savedScrollX = window.scrollX;
          const savedScrollY = window.scrollY;
          window.scrollTo(0, 0);

          // Container khusus cetak PDF dengan posisi absolute di paling atas body
          const printWrapper = document.createElement('div');
          printWrapper.id = 'pdf-print-wrapper';
          printWrapper.style.position = 'absolute';
          printWrapper.style.top = '0';
          printWrapper.style.left = '0';
          printWrapper.style.width = '1480px'; // Lebar pas untuk A3 Landscape
          printWrapper.style.backgroundColor = '#ffffff';
          printWrapper.style.padding = '20px';
          printWrapper.style.boxSizing = 'border-box';
          printWrapper.style.zIndex = '999999';
          printWrapper.style.fontFamily = 'Arial, sans-serif';
          
          // Judul Laporan di dalam PDF
          const titleEl = document.createElement('h2');
          titleEl.style.fontSize = '18px';
          titleEl.style.fontWeight = 'bold';
          titleEl.style.color = '#1e1b4b';
          titleEl.style.marginBottom = '12px';
          titleEl.style.textAlign = 'center';
          titleEl.style.borderBottom = '2px solid #6366f1';
          titleEl.style.paddingBottom = '8px';
          titleEl.innerText = titleText;
          printWrapper.appendChild(titleEl);
          
          // Duplikat Tabel
          const clonedTable = originalTable.cloneNode(true);
          
          // Hitung Jumlah Kolom secara Dinamis
          const headerCells = clonedTable.querySelectorAll('thead tr th');
          const colCount = headerCells.length || 15;
          
          // Skala font & padding otomatis agar SEMUA kolom (sampai Des 26 & Grand Total) muat dalam 1 lembar A3
          let fontSize = '9px';
          let cellPadding = '4px 5px';
          if (colCount >= 18) {
            fontSize = '7px';
            cellPadding = '2px 3px';
          } else if (colCount >= 14) {
            fontSize = '8px';
            cellPadding = '3px 4px';
          }
          
          clonedTable.style.width = '100%';
          clonedTable.style.borderCollapse = 'collapse';
          clonedTable.style.fontSize = fontSize;
          clonedTable.style.tableLayout = 'auto';
          
          // FORMAT EXPLICIT INLINE CSS & REMOVE ALL TAILWIND CLASSES (Mencegah html2canvas crash / blank)
          const allRows = clonedTable.querySelectorAll('tr');
          allRows.forEach((row) => {
            row.style.pageBreakInside = 'avoid';
            row.style.breakInside = 'avoid';
            
            const isHeader = row.parentElement && row.parentElement.tagName === 'THEAD';
            const isSectionHeader = row.classList.contains('bg-indigo-50') || row.querySelector('td[colspan]');
            const isTotalRow = row.classList.contains('bg-indigo-100');
            
            const cells = row.querySelectorAll('th, td');
            cells.forEach((cell, cellIdx) => {
              cell.style.fontSize = fontSize;
              cell.style.padding = cellPadding;
              cell.style.whiteSpace = 'nowrap';
              cell.style.pageBreakInside = 'avoid';
              cell.style.breakInside = 'avoid';
              cell.style.position = 'static'; // Hapus sticky position
              
              if (isHeader) {
                cell.style.backgroundColor = '#3730a3'; // Indigo-800
                cell.style.color = '#ffffff';
                cell.style.border = '1px solid #4338ca';
                cell.style.fontWeight = 'bold';
              } else if (isSectionHeader) {
                cell.style.backgroundColor = '#e0e7ff'; // Indigo-100
                cell.style.color = '#3730a3';
                cell.style.border = '1px solid #c7d2fe';
                cell.style.fontWeight = 'bold';
                cell.style.whiteSpace = 'normal';
              } else if (isTotalRow) {
                cell.style.backgroundColor = '#e0e7ff'; // Indigo-100
                cell.style.color = '#1e1b4b';
                cell.style.border = '1px solid #c7d2fe';
                cell.style.fontWeight = 'bold';
              } else {
                // Data rows
                cell.style.backgroundColor = row.classList.contains('bg-gray-50') ? '#f9fafb' : '#ffffff';
                cell.style.color = cell.classList.contains('text-gray-400') ? '#9ca3af' : '#1f2937';
                cell.style.border = '1px solid #e5e7eb';
                if (cellIdx === 0) {
                  cell.style.fontWeight = '600';
                  cell.style.whiteSpace = 'normal';
                  cell.style.maxWidth = '180px';
                }
              }
              
              // HAPUS TAILWIND CLASS AGAR HTML2CANVAS TIDAK ERROR VARIABEL CSS
              cell.removeAttribute('class');
            });
            
            row.removeAttribute('class');
          });

          printWrapper.appendChild(clonedTable);
          document.body.appendChild(printWrapper);
          
          // Sembunyikan overlay sementara agar html2canvas merekam gambar murni
          const overlay = document.getElementById('loading-overlay');
          if (overlay) overlay.style.display = 'none';

          const opt = {
            margin:       [0.2, 0.2, 0.2, 0.2],
            filename:     `${titleText.replace(/[^a-zA-Z0-9\s]/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
              scale: 2, 
              useCORS: true, 
              logging: false, 
              width: 1480,
              windowWidth: 1500,
              scrollX: 0,
              scrollY: 0,
              x: 0,
              y: 0
            },
            jsPDF:        { unit: 'in', format: 'a3', orientation: 'landscape' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
          };
          
          html2pdf().set(opt).from(printWrapper).save().then(() => {
            if (document.body.contains(printWrapper)) {
              document.body.removeChild(printWrapper);
            }
            window.scrollTo(savedScrollX, savedScrollY);
            hideLoading();
          }).catch(err => {
            console.error('Gagal membuat PDF:', err);
            if (document.body.contains(printWrapper)) {
              document.body.removeChild(printWrapper);
            }
            window.scrollTo(savedScrollX, savedScrollY);
            hideLoading();
          });

        } catch (err) {
          console.error('PDF Export Error:', err);
          hideLoading();
        }
      }, 250);
    }

    window.onload = checkSession;
  </script>
